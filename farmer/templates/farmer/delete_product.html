{% extends 'farmer/farmer_base.html' %}

{% block farmer_content %}
<div class="mb-4">
    <a href="{% url 'farmer:product_list' %}" class="text-success text-decoration-none fw-medium">&larr; Back to Products</a>
</div>

<div class="card border-0 shadow-sm rounded-4" style="max-width: 600px;">
    <div class="card-body p-5 text-center">
        <div class="bg-danger bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4" style="width: 80px; height: 80px;">
            <span class="fs-1 text-danger">⚠️</span>
        </div>
        
        <h3 class="fw-bold text-dark mb-3">Delete {{ product.name }}?</h3>
        <p class="text-muted mb-4">Are you sure you want to permanently delete this product from your inventory? This action cannot be undone.</p>
        
        <form method="post" class="d-flex gap-3 justify-content-center">
            {% csrf_token %}
            <a href="{% url 'farmer:product_list' %}" class="btn btn-light fw-medium px-4 py-2 rounded-pill shadow-sm">Cancel</a>
            <button type="submit" class="btn btn-danger fw-bold px-4 py-2 rounded-pill shadow-sm">Yes, Delete</button>
        </form>
    </div>
</div>
{% endblock farmer_content %}
